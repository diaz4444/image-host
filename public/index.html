<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f7" />
    <title>图床 · Image Shelf</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="图床首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none"><path d="M5.5 8.25A2.75 2.75 0 0 1 8.25 5.5h11.5a2.75 2.75 0 0 1 2.75 2.75v11.5a2.75 2.75 0 0 1-2.75 2.75H8.25a2.75 2.75 0 0 1-2.75-2.75V8.25Z" stroke="currentColor" stroke-width="1.8"/><path d="m8.5 18 3.1-3.2 2.6 2.55 2.25-2.2 3.05 2.85M17.3 10.45h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>图床</span>
        </a>
        <div class="topbar-actions">
          <span class="online-dot"><span></span> 本地运行中</span>
          <a class="github-link" href="/README.md" title="查看使用说明">使用说明</a>
        </div>
      </header>

      <main>
        <section class="workspace-heading">
          <div>
            <p class="eyebrow">IMAGE SHELF / 01</p>
            <h1>把图片变成<br /><em>可分享的链接</em></h1>
            <p class="intro">拖入一张图片，自动转换为 PNG，保存在你的服务端，并马上得到一个干净的直链。</p>
          </div>
          <div class="heading-note">
            <span class="note-line"></span>
            <p>轻量 · 私有 · 无依赖</p>
          </div>
        </section>

        <section class="upload-layout" aria-label="上传区域">
          <div class="upload-card">
            <div class="upload-card-header">
              <div>
                <span class="section-index">01</span>
                <h2>上传图片</h2>
              </div>
              <span class="format-tag">PNG ONLY</span>
            </div>
            <label class="dropzone" id="dropzone" for="file-input">
              <input id="file-input" type="file" accept="image/*" />
              <span class="upload-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32" fill="none"><path d="M16 21V5m0 0-5.5 5.5M16 5l5.5 5.5M7 18v5.25A3.75 3.75 0 0 0 10.75 27h10.5A3.75 3.75 0 0 0 25 23.25V18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
              <strong>拖拽图片到这里</strong>
              <span>或点击选择文件</span>
              <small>支持 JPG、JPEG、PNG、WEBP · 最大 20 MB</small>
            </label>
            <div class="upload-status" id="upload-status" role="status" aria-live="polite"></div>
          </div>

          <aside class="quick-facts">
            <div class="fact-block">
              <span class="section-index">02</span>
              <h2>工作方式</h2>
              <p>浏览器先将图片统一转为 PNG，服务端只保存图片文件，不需要数据库。</p>
            </div>
            <div class="fact-block fact-border">
              <span class="section-index">03</span>
              <h2>分享范围</h2>
              <p>本机或局域网可直接打开。部署到公网服务器后，链接即可在任何电脑访问。</p>
            </div>
          </aside>
        </section>

        <section class="library-section" aria-label="图片库">
          <div class="library-header">
            <div>
              <span class="section-index">04</span>
              <h2>图片库</h2>
            </div>
            <div class="library-meta"><span id="image-count">0</span> 张图片</div>
          </div>
          <div class="library-list" id="library-list">
            <div class="empty-state"><span class="loader"></span>正在读取图片库</div>
          </div>
        </section>
      </main>

      <footer class="footer"><span>IMAGE SHELF</span><span>保存于当前服务端 · PNG</span></footer>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
